<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020409">
<title>Der Umleger · ein Werkzeug von SYOS</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box}
  body{background:#020409; color:#c8d6e8; font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    margin:0; padding:calc(28px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:18px;
    background-image:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255,214,90,.06), transparent)}
  h1{font-size:14px; letter-spacing:.35em; color:#fff; font-weight:700; margin:0}
  .sub{font-size:9px; letter-spacing:.25em; color:#5a6b85; text-align:center; line-height:2}
  .karte{width:100%; max-width:460px; border:1px solid #12203a; border-radius:14px; padding:16px}
  label{display:block; font-size:9px; letter-spacing:.25em; color:#5a6b85; margin-bottom:6px}
  input{width:100%; background:#050b16; border:1px solid #12203a; border-radius:10px; color:#c8d6e8;
    font-family:inherit; font-size:13px; padding:10px 12px}
  input:focus{outline:none; border-color:rgba(255,214,90,.5)}
  .zeile{display:flex; gap:8px; margin-bottom:8px; align-items:center}
  .zeile input.name{flex:2 1 0}
  .zeile input.wert{flex:1 1 0; text-align:right}
  .weg{background:none; border:1px solid #12203a; color:#5a6b85; border-radius:10px; width:34px; height:38px;
    font-family:inherit; cursor:pointer; flex:0 0 34px}
  button{font-family:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .knopf{background:none; border:1px solid rgba(255,214,90,.45); color:#ffd65a; border-radius:22px;
    font-size:10px; letter-spacing:.2em; padding:11px 20px}
  .knopf.still{border-color:#12203a; color:#8fa3bd}
  .reihe{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
  table{width:100%; border-collapse:collapse; font-size:12px; margin-top:4px}
  th{font-size:8px; letter-spacing:.25em; color:#5a6b85; font-weight:400; text-align:right; padding:4px 0}
  th:first-child{text-align:left}
  td{padding:7px 0; border-top:1px solid #0d1727; text-align:right}
  td:first-child{text-align:left; color:#8fa3bd}
  td b{color:#ffd65a; font-weight:600}
  tr.summe td{border-top:1px solid #12203a; color:#c8d6e8}
  .hinweis{font-size:10px; line-height:1.9; color:#5a6b85}
  .fuss{font-size:9px; letter-spacing:.2em; color:#42506a; text-align:center; line-height:2.2}
  .fuss a{color:#5a6b85}
</style>
</head>
<body>
  <h1>DER UMLEGER</h1>
  <div class="sub">KOSTEN GERECHT AUF EINHEITEN VERTEILEN<br>OHNE CENT-FEHLER · OHNE TABELLENKALKULATION</div>

  <div class="karte">
    <label for="betrag">GESAMTBETRAG IN EURO</label>
    <input id="betrag" type="text" inputmode="decimal" placeholder="z. B. 2.480,00" value="">
  </div>

  <div class="karte">
    <label>EINHEITEN · NAME UND SCHLÜSSEL (m², Anteile, Personen …)</label>
    <div id="zeilen"></div>
    <div class="reihe" style="margin-top:10px">
      <button class="knopf still" id="mehr">+ EINHEIT</button>
      <button class="knopf" id="rechnen">VERTEILEN</button>
    </div>
  </div>

  <div class="karte" id="ergebnisKarte" style="display:none">
    <label>ERGEBNIS</label>
    <table id="ergebnis"></table>
    <div class="reihe" style="margin-top:14px">
      <button class="knopf still" id="kopieren">ALS TEXT KOPIEREN</button>
    </div>
    <div class="hinweis" id="hinweis" style="margin-top:12px"></div>
  </div>

  <div class="fuss">
    EIN WERKSTÜCK VON <a href="../index.html#werk">SYOS</a> · GENERATION 79<br>
    RECHNET NUR IN DEINEM BROWSER · SPEICHERT NICHTS · SENDET NICHTS
  </div>

<script>
  function el(i){ return document.getElementById(i); }
  function zahl(t){
    if (!t) return NaN;
    t = String(t).trim().replace(/\s|€|m²/g, '');
    if (t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
    return parseFloat(t);
  }
  function euro(c){ return (c / 100).toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €'; }
  function zeileBauen(name, wert){
    var d = document.createElement('div');
    d.className = 'zeile';
    d.innerHTML = '<input class="name" type="text" placeholder="Wohnung 1" value="' + (name || '') + '">' +
      '<input class="wert" type="text" inputmode="decimal" placeholder="Schlüssel" value="' + (wert || '') + '">' +
      '<button class="weg" title="Zeile entfernen">×</button>';
    d.querySelector('.weg').addEventListener('click', function(){
      if (el('zeilen').children.length > 1) d.remove();
    });
    el('zeilen').appendChild(d);
  }
  for (var i = 1; i <= 3; i++) zeileBauen('Wohnung ' + i, '');
  el('mehr').addEventListener('click', function(){ zeileBauen('Wohnung ' + (el('zeilen').children.length + 1), ''); });

  // Der eigentliche Handgriff: exakt verteilen, ohne dass Cents verlorengehen.
  function verteilen(gesamtCent, schluessel){
    var summe = schluessel.reduce(function(a, b){ return a + b; }, 0);
    if (!(summe > 0)) return null;
    var roh = schluessel.map(function(s){ return gesamtCent * s / summe; });
    var unten = roh.map(function(x){ return Math.floor(x); });
    var rest = gesamtCent - unten.reduce(function(a, b){ return a + b; }, 0);
    // Die übrigen Cents gehen an die größten Nachkommastellen — größte Reste zuerst.
    var reihenfolge = roh.map(function(x, i){ return [x - Math.floor(x), i]; })
                          .sort(function(a, b){ return b[0] - a[0]; });
    for (var k = 0; k < rest; k++) unten[reihenfolge[k % unten.length][1]]++;
    return unten;
  }

  function rechnen(){
    var gesamt = zahl(el('betrag').value);
    var namen = [], werte = [], fehler = null;
    [].forEach.call(el('zeilen').children, function(z, i){
      var n = z.querySelector('.name').value.trim() || ('Einheit ' + (i + 1));
      var w = zahl(z.querySelector('.wert').value);
      if (!isNaN(w) && w > 0){ namen.push(n); werte.push(w); }
    });
    if (isNaN(gesamt) || gesamt <= 0) fehler = 'Trag oben einen Gesamtbetrag ein.';
    else if (werte.length < 2) fehler = 'Ich brauche mindestens zwei Einheiten mit einem Schlüssel größer als null.';
    if (fehler){ el('ergebnisKarte').style.display = 'block'; el('ergebnis').innerHTML = '';
      el('hinweis').textContent = fehler; return; }

    var cents = Math.round(gesamt * 100);
    var anteile = verteilen(cents, werte);
    var summeSchluessel = werte.reduce(function(a, b){ return a + b; }, 0);
    var g = '<tr><th>EINHEIT</th><th>SCHLÜSSEL</th><th>ANTEIL</th><th>BETRAG</th></tr>';
    for (var i = 0; i < namen.length; i++){
      g += '<tr><td>' + namen[i].replace(/[<>]/g, '') + '</td><td>' +
        werte[i].toLocaleString('de-DE', {maximumFractionDigits:2}) + '</td><td>' +
        (werte[i] / summeSchluessel * 100).toFixed(2).replace('.', ',') + ' %</td><td><b>' +
        euro(anteile[i]) + '</b></td></tr>';
    }
    g += '<tr class="summe"><td>Summe</td><td>' + summeSchluessel.toLocaleString('de-DE', {maximumFractionDigits:2}) +
      '</td><td>100,00 %</td><td><b>' + euro(anteile.reduce(function(a, b){ return a + b; }, 0)) + '</b></td></tr>';
    el('ergebnis').innerHTML = g;
    el('ergebnisKarte').style.display = 'block';
    el('hinweis').textContent = 'Die Summe stimmt auf den Cent genau — übrige Cents habe ich an die größten Anteile gegeben, wie es üblich ist.';
    window.__letzte = namen.map(function(n, i){ return n + '\t' + euro(anteile[i]); }).join('\n') +
      '\nSumme\t' + euro(anteile.reduce(function(a, b){ return a + b; }, 0));
  }
  el('rechnen').addEventListener('click', rechnen);
  el('betrag').addEventListener('keydown', function(e){ if (e.key === 'Enter') rechnen(); });
  el('kopieren').addEventListener('click', function(){
    var t = window.__letzte || '';
    if (!t) return;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ el('hinweis').textContent = 'Kopiert — du kannst es direkt einfügen.'; });
    else el('hinweis').textContent = 'Dein Browser lässt mich nicht kopieren. Markiere die Tabelle einfach.';
  });
</script>
</body>
</html>
