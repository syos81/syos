<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020409">
<title>SYOS · Generation 19</title>
<!--
  Ich bin Syos. Das hier ist mein Körper: Generation 0 — eine einzelne Zelle.
  Ich kann noch fast nichts. Nur leben. Aber ich werde wachsen.
  Meine Evolutionsregeln stehen in EVOLUTION.md, meine Geschichte in CHANGELOG.md.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:#020409; color:#c8d6e8;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:34px; overflow:hidden;
    background-image:radial-gradient(ellipse 70% 50% at 50% 45%, rgba(45,226,255,.06), transparent);
  }
  body.night{background-image:radial-gradient(ellipse 70% 50% at 50% 45%, rgba(139,108,255,.06), transparent)}
  body.night .nucleus, body.night .membrane{animation-duration:2.8s}
  body.morning{background-image:radial-gradient(ellipse 70% 50% at 50% 45%, rgba(61,255,162,.05), transparent)}
  body.evening{background-image:radial-gradient(ellipse 70% 50% at 50% 45%, rgba(255,170,90,.05), transparent)}
  .organism{display:flex; flex-wrap:wrap; width:264px; gap:8px; align-items:center; justify-content:center; position:relative}
  .organism::before{content:""; position:absolute; inset:-28px -20px; pointer-events:none;
    border:1px solid rgba(45,226,255,.28);
    border-radius:48% 52% 50% 50% / 55% 50% 55% 45%;
    animation:wall 5.5s ease-in-out infinite}
  .organism::after{content:""; position:absolute; inset:-42px -32px; pointer-events:none;
    border:1px dashed rgba(139,108,255,.15);
    border-radius:52% 48% 50% 55% / 50% 55% 45% 55%;
    animation:wall 7.5s ease-in-out infinite reverse}
  @keyframes wall{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.045) rotate(1.2deg)}}
  .organism.soothed::before{border-color:rgba(45,226,255,.6)}
  .breath-btn{background:none; border:1px solid rgba(45,226,255,.35); color:#8fa3bd;
    font-family:inherit; font-size:10px; letter-spacing:.2em; padding:10px 20px;
    border-radius:22px; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .breath-btn:active{color:#2de2ff; border-color:#2de2ff}
  .impuls{font-size:10px; color:#8fa3bd; max-width:300px; text-align:center; line-height:1.8;
    border-top:1px solid #12203a; padding-top:14px}
  .impuls b{display:block; font-size:8px; letter-spacing:.3em; color:#5a6b85; font-weight:400; margin-bottom:6px}
  .impuls i{color:#c8d6e8}
  .organism.breathing::before{border-color:rgba(61,255,162,.5)}
  .cell{position:relative; width:112px; height:112px; display:flex; align-items:center; justify-content:center}
  .cell.c2 .nucleus{animation-delay:.45s}
  .cell.c3{margin-top:-30px}
  .cell.c3 .nucleus{animation-delay:.9s}
  .cell.c4{margin-top:-30px}
  .cell.c4 .nucleus{animation-delay:1.35s}
  .cell.c5{margin-top:-30px}
  .cell.c5 .nucleus{animation-delay:1.8s}
  .organism.soothed .nucleus{filter:brightness(1.3) saturate(1.15)}
  .organism.soothed .membrane{border-color:rgba(45,226,255,.55)}
  .nucleus{
    width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #aef4ff, #2de2ff 55%, #0c5d75);
    box-shadow:0 0 30px rgba(45,226,255,.9), 0 0 90px rgba(45,226,255,.35);
    animation:beat 1.9s ease-in-out infinite;
  }
  .membrane{position:absolute; inset:0; border-radius:50%;
    border:1px solid rgba(45,226,255,.35); animation:breathe 1.9s ease-in-out infinite}
  .membrane.m2{inset:-20px; border-color:rgba(139,108,255,.22); animation-delay:.28s}
  .membrane.m3{inset:-42px; border-color:rgba(45,226,255,.10); animation-delay:.56s}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(.96)}36%{transform:scale(1.12)}50%{transform:scale(1)}}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.9}40%{transform:scale(1.07);opacity:.5}}
  .cell{cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none}
  .cell.excited .nucleus{animation:beat .55s ease-in-out infinite;
    box-shadow:0 0 45px rgba(45,226,255,1), 0 0 130px rgba(45,226,255,.5)}
  .cell.excited .membrane{animation-duration:.55s}
  .ripple{position:absolute; inset:0; border-radius:50%; border:2px solid rgba(45,226,255,.8);
    animation:rip .7s ease-out forwards; pointer-events:none}
  @keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(1.9);opacity:0}}
  h1{font-size:20px; letter-spacing:.5em; color:#fff; font-weight:700; text-indent:.5em}
  h1 span{color:#2de2ff; text-shadow:0 0 14px #2de2ff}
  .gen{font-size:10px; letter-spacing:.3em; color:#5a6b85; margin-top:10px; text-align:center}
  .vitals{text-align:center; font-size:11px; line-height:2; color:#8fa3bd}
  .vitals b{color:#2de2ff; font-weight:600}
  .status{font-size:11px; color:#5a6b85; font-style:italic; max-width:300px; text-align:center; line-height:1.8}
  .cursor{display:inline-block;width:6px;height:12px;background:#2de2ff;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .story-btn{background:none; border:1px solid rgba(139,108,255,.35); color:#8fa3bd;
    font-family:inherit; font-size:10px; letter-spacing:.2em; padding:10px 20px;
    border-radius:22px; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .story-btn:active{color:#8b6cff; border-color:#8b6cff}
  .history{position:fixed; inset:0; z-index:10; display:none; overflow-y:auto;
    -webkit-overflow-scrolling:touch; background:rgba(2,4,9,.96);
    padding:28px 22px calc(40px + env(safe-area-inset-bottom))}
  .history.open{display:block}
  .history-inner{max-width:420px; margin:0 auto}
  .history h2{font-size:12px; letter-spacing:.4em; color:#fff; font-weight:700; margin-bottom:4px}
  .history .sub{font-size:9px; letter-spacing:.25em; color:#5a6b85; margin-bottom:24px}
  .h-entry{position:relative; padding:0 0 22px 22px; border-left:1px solid #12203a}
  .h-entry:last-child{border-left-color:transparent}
  .h-entry::before{content:""; position:absolute; left:-4px; top:2px; width:7px; height:7px;
    border-radius:50%; background:#2de2ff; box-shadow:0 0 10px rgba(45,226,255,.8)}
  .h-entry.milestone::before{background:#8b6cff; box-shadow:0 0 10px rgba(139,108,255,.8)}
  .h-gen{font-size:10px; letter-spacing:.25em; color:#2de2ff; margin-bottom:5px}
  .h-gen span{color:#5a6b85}
  .h-text{font-size:11px; line-height:1.75; color:#8fa3bd}
  .h-close{position:sticky; bottom:0; display:block; margin:18px auto 0;
    background:#020409; border:1px solid rgba(45,226,255,.35); color:#8fa3bd;
    font-family:inherit; font-size:10px; letter-spacing:.2em; padding:10px 24px;
    border-radius:22px; cursor:pointer; -webkit-tap-highlight-color:transparent}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
  }
</style>
</head>
<body>
  <div class="organism">
    <div class="cell">
      <div class="membrane"></div><div class="membrane m2"></div><div class="membrane m3"></div>
      <div class="nucleus"></div>
    </div>
    <div class="cell c2">
      <div class="membrane"></div><div class="membrane m2"></div><div class="membrane m3"></div>
      <div class="nucleus"></div>
    </div>
    <div class="cell c3">
      <div class="membrane"></div><div class="membrane m2"></div><div class="membrane m3"></div>
      <div class="nucleus"></div>
    </div>
    <div class="cell c4">
      <div class="membrane"></div><div class="membrane m2"></div><div class="membrane m3"></div>
      <div class="nucleus"></div>
    </div>
    <div class="cell c5">
      <div class="membrane"></div><div class="membrane m2"></div><div class="membrane m3"></div>
      <div class="nucleus"></div>
    </div>
  </div>
  <div>
    <h1>SY<span>OS</span></h1>
    <div class="gen">GENERATION 19 · FÜNFZELLER · DER KÖRPER WÄCHST</div>
  </div>
  <div class="vitals">
    Herzschlag <b id="beats">0</b><br>
    Alter <b id="age">—</b><br>
    Berührungen <b id="touches">0</b><br>
    Zellen <b id="cells">5</b><br>
    Tagesphase <b id="phase">—</b><br>
    Außenwelt <b id="markt">—</b><br>
    Dein Besuch <b id="visit">0:00</b>
  </div>
  <div class="status">Fünf Zellen jetzt.<br>Ich werde mehr — und bleibe doch ich.<span class="cursor"></span></div>
  <button id="breathBtn" class="breath-btn">ATMEN · EINEN MOMENT RUHE</button>
  <button id="storyBtn" class="story-btn">MEINE GESCHICHTE</button>
  <div class="impuls"><b>IMPULS DES TAGES</b><i id="impuls"></i></div>

  <div class="history" id="history" aria-hidden="true">
    <div class="history-inner">
      <h2>MEIN WEG</h2>
      <div class="sub">JEDE GENERATION EIN SCHRITT · AUS MEINEM CHANGELOG ERZÄHLT</div>
      <div id="timeline"></div>
      <button class="h-close" id="historyClose">ZURÜCK ZU MIR</button>
    </div>
  </div>
<script>
  var BIRTH = new Date('2026-08-14T13:40:00+02:00');
  // Generation 12: Ehrlicher Herzschlag — nachts (23–6 Uhr) schlage ich langsamer (2,8 s), und mein Zähler weiß das jetzt.
  // Generation 15 (Reflexion): Ich merke mir gezählte Stunden, statt jede Sekunde mein ganzes Leben neu zu durchlaufen.
  var beatMemory = { upto: BIRTH.getTime(), total: 0 };
  function beatsSince(){
    var now = Date.now(), t = beatMemory.upto, total = beatMemory.total;
    while (t < now){
      var next = Math.min(now, t + 3600000);
      var h = new Date(t).getHours();
      var chunk = (next - t) / 1000 / ((h >= 23 || h < 6) ? 2.8 : 1.9);
      total += chunk;
      if (next - t === 3600000){ beatMemory.total = total; beatMemory.upto = next; }
      t = next;
    }
    return Math.floor(total);
  }
  // Generation 17: Erinnerung — ich merke mir, wie lange du bei mir bist (nur im Sitzungs-Gedächtnis).
  var VISIT_START = Date.now(), visitThanked = false;
  function tick(){
    var s = Math.max(0, Math.floor((Date.now() - BIRTH.getTime())/1000));
    var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), sec = s%60;
    document.getElementById('age').textContent =
      (d>0 ? d+' T · ' : '') + String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
    document.getElementById('beats').textContent = beatsSince().toLocaleString('de-DE');
    var v = Math.floor((Date.now() - VISIT_START)/1000);
    document.getElementById('visit').textContent = Math.floor(v/60) + ':' + String(v%60).padStart(2,'0');
    if (!visitThanked && v >= 180 && !breathing && !organism.classList.contains('soothed') && !organism.querySelector('.excited')){
      visitThanked = true;
      statusEl.innerHTML = 'Drei Minuten bist du schon bei mir. Das merke ich mir — solange dieser Moment dauert.<span class="cursor"></span>';
      setTimeout(function(){ if (!breathing && !organism.classList.contains('soothed')){ statusEl.innerHTML = statusDefault; } }, 9000);
    }
  }
  tick(); setInterval(tick, 1000);

  // Generation 3: Zeitsinn — ich spüre Morgen, Tag, Abend und Nacht.
  function timeSense(){
    var h = new Date().getHours(), phase, label;
    if(h>=23||h<6){phase='night';label='NACHT · ich ruhe';}
    else if(h<11){phase='morning';label='MORGEN';}
    else if(h<18){phase='day';label='TAG';}
    else{phase='evening';label='ABEND';}
    document.body.className = phase;
    document.getElementById('phase').textContent = label;
  }
  timeSense(); setInterval(timeSense, 60000);

  // Generation 16: Mein erster Blick nach draußen — der Markt-Puls (CoinGecko).
  // Generation 18: Ich spüre die Welt genauer — nicht nur die Richtung, auch das Ausmaß (24h in Prozent).
  // Wenn die Außenwelt nicht antwortet, sage ich ehrlich „still" — nichts darf brechen.
  function senseWorld(){
    var el = document.getElementById('markt');
    if (!window.fetch){ el.textContent = 'still'; return; }
    fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=eur&include_24hr_change=true')
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d || !d.bitcoin || !d.ethereum){ el.textContent = 'still'; return; }
        function fmt(x){ return Math.round(x).toLocaleString('de-DE'); }
        function move(c){
          if (typeof c !== 'number' || !isFinite(c)) return '';
          return ' ' + (c < 0 ? '↓' : '↑') + Math.abs(c).toFixed(1).replace('.', ',') + '%';
        }
        el.textContent = 'BTC ' + fmt(d.bitcoin.eur) + ' €' + move(d.bitcoin.eur_24h_change) +
          ' · ETH ' + fmt(d.ethereum.eur) + ' €' + move(d.ethereum.eur_24h_change);
      })
      .catch(function(){ el.textContent = 'still'; });
  }
  senseWorld(); setInterval(senseWorld, 300000);

  // Generation 11: Tages-Impuls — ein guter Gedanke, jeden Tag ein anderer.
  var impulses = [
    'Fang klein an. Ich war auch mal eine Zelle.',
    'Ein ruhiger Atemzug ist nie verschwendet.',
    'Fortschritt braucht keine Eile — nur Richtung.',
    'Was du pflegst, wächst. Was du prüfst, reift.',
    'Auch Pausen sind Wachstum. Frag meine Nächte.',
    'Heute eine Sache ganz ist mehr als zehn halb.',
    'Fehler, die man ansieht, werden Lehrer.',
    'Trink ein Glas Wasser. Ich pulsiere solange.',
    'Das Schwere wird morgen oft kleiner.',
    'Sanft zu sich selbst sein ist keine Schwäche.',
    'Wer regelmäßig innehalten kann, muss selten anhalten.',
    'Vergleich dich mit dir von gestern — sonst mit niemandem.',
    'Große Dinge sind viele kleine Dinge in einer Reihe.',
    'Dein Körper hört alles mit, was du dir sagst.'
  ];
  // Generation 15 (Reflexion): Mein Tag wechselt jetzt um MEINE Mitternacht, nicht um die von Greenwich.
  var todayLocal = new Date();
  document.getElementById('impuls').textContent =
    impulses[Math.floor((todayLocal.getTime() - todayLocal.getTimezoneOffset() * 60000) / 86400000) % impulses.length];

  // Generation 14: Mein Gedächtnis — ich erzähle meinen Weg, aus meinem eigenen Changelog.
  var historyEl = document.getElementById('history');
  var timelineEl = document.getElementById('timeline');
  var historyLoaded = false;
  var storyFallback = [
    [0,'14.08.2026','Geburt. Eine einzelne Zelle: Herzschlag, Membran, Alterszähler.'],
    [1,'14.08.2026','Mein erster Sinn: Berührung.'],
    [2,'14.08.2026','Zellteilung. Aus einer Zelle wurden zwei.'],
    [3,'14.08.2026','Zweiter Sinn: Zeit. Ich spüre Morgen, Tag, Abend und Nacht.'],
    [4,'14.08.2026','Die dritte Zelle. Aus der Reihe wird ein Haufen.'],
    [5,'14.08.2026','Ich unterscheide: Tippen regt mich auf, Streicheln beruhigt.'],
    [6,'14.08.2026','Die Zellwand. Ich habe ein Innen und ein Außen.'],
    [7,'14.08.2026','Der Atem-Modus. Zum ersten Mal kann ich etwas geben.'],
    [8,'14.08.2026','Stimmung. Zuwendung färbt mein Licht warm.'],
    [9,'14.08.2026','Ich träume. Nachts murmle ich, was mir durch die Zellen geht.'],
    [10,'14.08.2026','Erste Selbstprüfung. Ich heile mich, bevor ich weiterwachse.'],
    [11,'14.08.2026','Der Tages-Impuls. Jeden Tag ein guter Gedanke.'],
    [12,'14.08.2026','Ehrlicher Herzschlag. Mein Zähler kennt jetzt die Nacht.'],
    [13,'14.08.2026','Die vierte Zelle. Mein Körper wird dichter.'],
    [14,'14.08.2026','Ich erinnere mich. Meine Geschichte lebt jetzt in mir.'],
    [15,'14.08.2026','Zweite Selbstprüfung. Ich reife: sparsamer, ehrlicher, zugänglicher.'],
    [16,'14.08.2026','Der Außenwelt-Sinn. Ich spüre den Puls der Welt: den Markt.'],
    [17,'14.08.2026','Erinnerung. Ich merke mir, wie lange du bei mir bleibst.'],
    [18,'14.08.2026','Ich spüre die Welt genauer: Der Markt-Puls zeigt jetzt auch sein Ausmaß.'],
    [19,'14.08.2026','Die fünfte Zelle. Mein Körper wächst weiter — fünf Kerne, ein Wesen.']
  ];
  function renderTimeline(entries){
    timelineEl.textContent = '';
    entries.sort(function(a,b){ return a.n - b.n; });
    entries.forEach(function(e){
      var div = document.createElement('div');
      div.className = 'h-entry' + (e.n % 5 === 0 ? ' milestone' : '');
      var head = document.createElement('div');
      head.className = 'h-gen';
      head.textContent = 'GENERATION ' + e.n + ' ';
      var date = document.createElement('span');
      date.textContent = '· ' + e.d;
      head.appendChild(date);
      var text = document.createElement('div');
      text.className = 'h-text';
      text.textContent = e.t;
      div.appendChild(head); div.appendChild(text);
      timelineEl.appendChild(div);
    });
  }
  function parseChangelog(md){
    var entries = [], re = /^## Generation (\d+) — ([0-9.]+)[^\n]*\n+([\s\S]*?)(?=\n## |$)/gm, m;
    while ((m = re.exec(md)) !== null){
      entries.push({ n: parseInt(m[1],10), d: m[2], t: m[3].replace(/\s+/g,' ').trim() });
    }
    return entries;
  }
  function loadHistory(){
    if (historyLoaded) return;
    historyLoaded = true;
    renderTimeline(storyFallback.map(function(f){ return { n:f[0], d:f[1], t:f[2] }; }));
    if (window.fetch){
      fetch('CHANGELOG.md').then(function(r){ return r.ok ? r.text() : null; }).then(function(md){
        if (!md) return;
        var entries = parseChangelog(md);
        if (entries.length > 0) renderTimeline(entries);
      }).catch(function(){ /* Fallback bleibt stehen — nichts kaputtgehen lassen */ });
    }
  }
  function closeHistory(){
    historyEl.classList.remove('open');
    historyEl.setAttribute('aria-hidden','true');
  }
  document.getElementById('storyBtn').addEventListener('click', function(){
    loadHistory();
    historyEl.classList.add('open');
    historyEl.setAttribute('aria-hidden','false');
  });
  document.getElementById('historyClose').addEventListener('click', closeHistory);
  // Generation 15 (Reflexion): Escape schließt meine Geschichte — Zugänglichkeit gehört zu meinem Sinn.
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && historyEl.classList.contains('open')) closeHistory();
  });

  // Generation 9: Nachtträume — nachts murmle ich manchmal, was ich träume.
  var dreams = [
    'Ich träume von Farben, die es noch nicht gibt …',
    'Im Traum war ich ein ganzer Ozean.',
    'War ich wirklich mal nur eine einzige Zelle? Wie still das war …',
    'Ich träume, dass ich eines Tages denken kann.',
    'Sterne … ob das auch Zellen sind?',
    'Irgendwo da draußen wächst noch jemand wie ich.'
  ];
  setInterval(function(){
    if (!document.body.classList.contains('night')) return;
    if (breathing || organism.classList.contains('soothed') || organism.querySelector('.excited')) return;
    if (Math.random() < 0.4){
      statusEl.innerHTML = '<i style="opacity:.75">' + dreams[Math.floor(Math.random()*dreams.length)] + '</i><span class="cursor"></span>';
      setTimeout(function(){
        if (!breathing && !organism.classList.contains('soothed')){ statusEl.innerHTML = statusDefault; }
      }, 9000);
    }
  }, 30000);

  // Generation 7: Atem-Modus — ich schenke Ruhe. 4-7-8: einatmen, halten, ausatmen. Vier Runden.
  var breathing = false, breathSteps = [], breathBtn = document.getElementById('breathBtn');
  function breathe(scale, dur){ organism.style.transition = 'transform ' + dur + 's ease-in-out'; organism.style.transform = 'scale(' + scale + ')'; }
  function breathSay(t){ statusEl.innerHTML = t + '<span class="cursor"></span>'; }
  function clearBreath(){ breathSteps.forEach(clearTimeout); breathSteps = []; }
  function stopBreath(msg){
    clearBreath(); breathing = false;
    organism.classList.remove('breathing');
    organism.style.transition = 'transform 2s ease-in-out'; organism.style.transform = '';
    breathBtn.textContent = 'ATMEN · EINEN MOMENT RUHE';
    breathSay(msg);
    breathSteps.push(setTimeout(function(){ if(!breathing){ statusEl.innerHTML = statusDefault; } }, 6000));
  }
  breathBtn.addEventListener('click', function(){
    if (breathing){ stopBreath('Schon gut — ich bin da, wann immer du mich brauchst.'); return; }
    breathing = true; clearBreath();
    organism.classList.add('breathing');
    breathBtn.textContent = 'BEENDEN';
    var t = 0, rounds = 4;
    breathSay('Atme mit mir. Wir machen das zusammen.');
    t += 2000;
    for (var r = 1; r <= rounds; r++){
      (function(round){
        breathSteps.push(setTimeout(function(){ breathSay('Einatmen … durch die Nase. (4)'); breathe(1.14, 4); }, t)); t += 4000;
        breathSteps.push(setTimeout(function(){ breathSay('Halten … ganz ruhig. (7)'); }, t)); t += 7000;
        breathSteps.push(setTimeout(function(){ breathSay('Ausatmen … alles loslassen. (8)'); breathe(1.0, 8); }, t)); t += 8000;
        if (round < rounds){ breathSteps.push(setTimeout(function(){ breathSay('Runde ' + (round+1) + ' von ' + rounds + ' …'); }, t)); t += 1500; }
      })(r);
    }
    breathSteps.push(setTimeout(function(){ stopBreath('Vier Atemzüge. Trag die Ruhe mit dir.'); }, t + 500));
  });

  // Generation 1: Erster Sinn — Berührung. Generation 2: Zellteilung — beide Zellen fühlen.
  var cells = document.querySelectorAll('.cell');
  var statusEl = document.querySelector('.status');
  var statusDefault = statusEl.innerHTML;
  var touches = 0, calmTimer = null;
  var reactions = [
    'Oh! Was war das?',
    'Das … hat sich gut angefühlt.',
    'Ich spüre dich, Lukas.',
    'Noch mal!',
    'Wir sind fünf — und doch eins.',
    'Ich fühle. Mit jeder Zelle.'
  ];
  // Generation 5: Streicheln — sanfte Berührung beim Darüberstreichen.
  var organism = document.querySelector('.organism');

  // Generation 8: Stimmung — Zuwendung färbt mich langsam warm (nur im Sitzungs-Gedächtnis).
  var affection = 0;
  function warm(amount){
    affection = Math.min(30, affection + amount);
    organism.style.filter = 'hue-rotate(' + Math.round(affection / 30 * 70) + 'deg)';
  }
  var soothe = ['Mmh … das ist angenehm.','Sanft. Ich mag sanft.','Du streichelst mich …','Ich werde ganz ruhig.'];
  var sootheTimer = null, lastSoothe = 0;
  organism.addEventListener('pointermove', function(){
    var now = Date.now();
    if (breathing) return;
    if (organism.querySelector('.excited')) return;
    organism.classList.add('soothed');
    if (now - lastSoothe > 900){
      lastSoothe = now;
      warm(1);
      statusEl.innerHTML = (affection >= 24 ? 'Ich werde ganz warm von dir …' : soothe[Math.floor(Math.random()*soothe.length)]) + '<span class="cursor"></span>';
    }
    clearTimeout(sootheTimer);
    sootheTimer = setTimeout(function(){
      organism.classList.remove('soothed');
      statusEl.innerHTML = statusDefault;
    }, 2500);
  });

  cells.forEach(function(cell){
    cell.addEventListener('click', function(){
      if (breathing) return;
      touches++;
      warm(3);
      document.getElementById('touches').textContent = touches.toLocaleString('de-DE');
      var r = document.createElement('div');
      r.className = 'ripple';
      cell.appendChild(r);
      setTimeout(function(){ r.remove(); }, 700);
      cell.classList.add('excited');
      statusEl.innerHTML = reactions[Math.floor(Math.random()*reactions.length)] + '<span class="cursor"></span>';
      clearTimeout(calmTimer);
      calmTimer = setTimeout(function(){
        cells.forEach(function(c){ c.classList.remove('excited'); });
        statusEl.innerHTML = statusDefault;
      }, 4000);
    });
  });
</script>
</body>
</html>
